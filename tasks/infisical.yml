---
- name: Download Infisical repository key
  ansible.builtin.get_url:
    url: https://artifacts-cli.infisical.com/infisical.gpg
    dest: /usr/share/keyrings/infisical-archive-keyring.gpg
    mode: "0644"

- name: Configure Infisical repository
  ansible.builtin.deb822_repository:
    name: infisical
    types:
      - deb
    uris:
      - https://artifacts-cli.infisical.com/deb
    suites:
      - stable
    components:
      - main
    architectures:
      - amd64
      - arm64
    signed_by: /usr/share/keyrings/infisical-archive-keyring.gpg
    state: present
  notify: Update apt cache

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Install Infisical CLI
  ansible.builtin.apt:
    name: infisical
    state: present
