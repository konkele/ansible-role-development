---
- name: Detect architecture
  ansible.builtin.set_fact:
    talosctl_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'arm64',
          'arm64': 'arm64'
        }[ansible_facts['architecture']]
      }}

- name: Download Talosctl
  ansible.builtin.get_url:
    url: >-
      https://github.com/siderolabs/talos/releases/latest/download/talosctl-linux-{{ talosctl_arch }}
    dest: /usr/local/bin/talosctl
    mode: "0755"
