---
- name: Download Kubernetes repository key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/{{ development_kubectl_repository_version }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: Configure Kubernetes repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types:
      - deb
    uris:
      - https://pkgs.k8s.io/core:/stable:/{{ development_kubectl_repository_version }}/deb/
    suites:
      - /
    components: []
    signed_by: /etc/apt/keyrings/kubernetes.asc
    state: present
  notify: Update apt cache

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Install kubectl
  ansible.builtin.apt:
    name: kubectl
    state: present
