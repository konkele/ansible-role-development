---
galaxy_info:
  role_name: development
  namespace: konkele
  author: Eric Konkel

  description: >-
    Development workstation role for infrastructure and platform
    engineering hosts. Installs common development and automation
    tooling and supports creation of custom commands for
    environment-specific workflows.

  license: MIT

  min_ansible_version: "2.14"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie

    - name: Ubuntu
      versions:
        - jammy
        - noble

  galaxy_tags:
    - development
    - ansible
    - opentofu
    - kubernetes
    - talos
    - infisical
    - infrastructure
    - devops
    - sre

dependencies: []
